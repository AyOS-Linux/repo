name: Build AyOS Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Кэш для pacman (скачанные пакеты зависимостей)
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ hashFiles('**/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      # 2. Кэш для ccache (промежуточные объектные файлы компиляции)
      #    Кэшируем папку, где ccache будет хранить данные для пользователя builder
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 3. Обновление системы и установка всех нужных пакетов, включая ccache
      - name: Update system and install tools
        run: pacman -Syu --noconfirm base-devel git ccache

      # 4. Создаём пользователя builder для makepkg
      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Даём builder права на папку с исходниками
          chown -R builder:builder .

      # 5. Сборка пакетов
      - name: Build packages
        run: |
          mkdir -p /tmp/pkgout
          chown -R builder:builder /tmp/pkgout
          for pkgdir in */; do
            if [ -f "${pkgdir}PKGBUILD" ]; then
              echo "::group::Building ${pkgdir}"
              cd "$pkgdir"
              # Убедимся, что ccache доступен builder'у и настроен на использование
              su builder -c "export PATH=/usr/lib/ccache:\$PATH; makepkg -sf --noconfirm --nocheck"
              cd ..
              echo "::endgroup::"
            fi
          done
          find . -name "*.pkg.tar.zst" -exec cp {} /tmp/pkgout/ \;

      # 6. Создание базы данных репозитория
      - name: Create repo database
        run: |
          mkdir -p public/x86_64
          cp /tmp/pkgout/*.pkg.tar.zst public/x86_64/ 2>/dev/null || true
          cd public/x86_64
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            repo-add ayos.db.tar.zst *.pkg.tar.zst
            # Удаляем hardlink, чтобы cp не ругался
            rm -f ayos.db
            cp ayos.db.tar.zst ayos.db
          fi

      # 7. Публикация на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
