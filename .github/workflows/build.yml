name: Build AyOS Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ github.ref }}
          restore-keys: |
            ${{ github.job }}-

      - name: Setup pacman cache
        uses: actions/cache@v3
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ hashFiles('**/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Update system and install tools
        run: pacman -Syu --noconfirm base-devel git ccache

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build packages
        run: |
          mkdir -p /tmp/pkgout
          chown -R builder:builder /tmp/pkgout
          for pkgdir in */; do
            if [ -f "${pkgdir}PKGBUILD" ]; then
              echo "::group::Building ${pkgdir}"
              cd "$pkgdir"
              su builder -c "makepkg -sf --noconfirm --nocheck"
              cd ..
              echo "::endgroup::"
            fi
          done
          find . -name "*.pkg.tar.zst" -exec cp {} /tmp/pkgout/ \;

      - name: Create repo database
        run: |
          mkdir -p public/x86_64
          cp /tmp/pkgout/*.pkg.tar.zst public/x86_64/ 2>/dev/null || true
          cd public/x86_64
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            repo-add ayos.db.tar.zst *.pkg.tar.zst
            rm -f ayos.db
            cp ayos.db.tar.zst ayos.db
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
