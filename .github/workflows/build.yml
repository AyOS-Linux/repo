name: Build AyOS Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install base-devel
        run: pacman -Syu --noconfirm base-devel git

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build packages
        run: |
          mkdir -p /tmp/pkgout
          chown -R builder:builder /tmp/pkgout
          for pkgdir in */; do
            if [ -f "${pkgdir}PKGBUILD" ]; then
              echo "::group::Building ${pkgdir}"
              cd "$pkgdir"
              chown -R builder:builder .
              su builder -c "makepkg -sf --noconfirm --nocheck"
              cd ..
              echo "::endgroup::"
            fi
          done
          find . -name "*.pkg.tar.zst" -exec cp {} /tmp/pkgout/ \;

      - name: Create repo database
        run: |
          mkdir -p public/x86_64
          cp /tmp/pkgout/*.pkg.tar.zst public/x86_64/ 2>/dev/null || true
          cd public/x86_64
          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            repo-add ayos.db.tar.zst *.pkg.tar.zst
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
